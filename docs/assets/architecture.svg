<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="Layered architecture: React components, the state layer, and the pure domain layer">
  <defs>
    <style>
      .t { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
      .layer { fill: #121d24; stroke: #29404b; stroke-width: 1.5; }
      .card { fill: #16242c; stroke: #2f4a56; stroke-width: 1.5; }
      .h { fill: #e6f1f5; font-size: 17px; font-weight: 600; }
      .p { fill: #90a9b6; font-size: 13px; }
      .k { fill: #6ee7d7; font-size: 13px; }
      .arrow { stroke: #2dd4bf; stroke-width: 2; fill: none; marker-end: url(#a); }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <rect width="1100" height="560" rx="16" fill="#0d1117"/>

  <!-- UI layer -->
  <rect x="40" y="36" width="1020" height="146" rx="12" class="layer"/>
  <text x="64" y="66" class="t h">src/components/ · src/app/</text>
  <text x="64" y="88" class="t p">React 19 · Next.js App Router · Tailwind v4. May not contain logic worth testing.</text>
  <g>
    <rect x="64" y="104" width="230" height="56" rx="9" class="card"/>
    <text x="80" y="128" class="mono k">canvas/</text>
    <text x="80" y="148" class="t p">pan · zoom · grid · minimap</text>

    <rect x="310" y="104" width="230" height="56" rx="9" class="card"/>
    <text x="326" y="128" class="mono k">editor/</text>
    <text x="326" y="148" class="t p">gestures · palette · inspector</text>

    <rect x="556" y="104" width="230" height="56" rx="9" class="card"/>
    <text x="572" y="128" class="mono k">nodes/</text>
    <text x="572" y="148" class="t p">one view per element</text>

    <rect x="802" y="104" width="234" height="56" rx="9" class="card"/>
    <text x="818" y="128" class="mono k">ui/</text>
    <text x="818" y="148" class="t p">generated by shadcn</text>
  </g>

  <path d="M550 182 V222" class="arrow"/>
  <text x="566" y="208" class="t p">commands down, one frame notification up</text>

  <!-- state layer -->
  <rect x="40" y="226" width="1020" height="118" rx="12" class="layer"/>
  <text x="64" y="256" class="t h">src/state/</text>
  <text x="64" y="278" class="t p">The only place the two worlds meet. Stores expose <tspan class="mono k">useSyncExternalStore</tspan> subscriptions.</text>
  <g>
    <rect x="64" y="294" width="236" height="34" rx="8" class="card"/>
    <text x="80" y="316" class="mono k">document.ts <tspan class="p t">· commands + undo</tspan></text>
    <rect x="316" y="294" width="236" height="34" rx="8" class="card"/>
    <text x="332" y="316" class="mono k">simulation.ts <tspan class="p t">· engine host</tspan></text>
    <rect x="568" y="294" width="236" height="34" rx="8" class="card"/>
    <text x="584" y="316" class="mono k">scene.ts <tspan class="p t">· derived graph</tspan></text>
    <rect x="820" y="294" width="216" height="34" rx="8" class="card"/>
    <text x="836" y="316" class="mono k">hit-test.ts</text>
  </g>

  <path d="M550 344 V384" class="arrow"/>

  <!-- domain layer -->
  <rect x="40" y="388" width="1020" height="140" rx="12" fill="#0f2226" stroke="#1f5f5a" stroke-width="1.5"/>
  <text x="64" y="418" class="t h">src/lib/ (pure domain)</text>
  <text x="64" y="440" class="t p">No React, no <tspan class="mono">next/*</tspan>, no DOM, no <tspan class="mono">window</tspan>. Runs in a plain Node test. Deterministic.</text>
  <g>
    <rect x="64" y="456" width="312" height="52" rx="9" fill="#14282c" stroke="#26645f" stroke-width="1.5"/>
    <text x="80" y="478" class="mono k">circuit/</text>
    <text x="80" y="498" class="t p">document · netlist · save format</text>

    <rect x="392" y="456" width="312" height="52" rx="9" fill="#14282c" stroke="#26645f" stroke-width="1.5"/>
    <text x="408" y="478" class="mono k">sim/</text>
    <text x="408" y="498" class="t p">4-valued logic · event queue · runner</text>

    <rect x="720" y="456" width="316" height="52" rx="9" fill="#14282c" stroke="#26645f" stroke-width="1.5"/>
    <text x="736" y="478" class="mono k">nodes/</text>
    <text x="736" y="498" class="t p">40 definitions + the registry</text>
  </g>
</svg>
