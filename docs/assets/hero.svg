<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Logits, an interactive canvas for designing and simulating digital logic">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111b21"/>
      <stop offset="1" stop-color="#0b1417"/>
    </linearGradient>
    <linearGradient id="wireOn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#7dd3fc" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <style>
      .t { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace; }
      .body { fill: #16232b; stroke: #2f4753; stroke-width: 2; }
      .pin { stroke: #64818f; stroke-width: 2.5; stroke-linecap: round; }
      .lbl { fill: #8fa8b5; font-size: 13px; letter-spacing: 0.08em; }
      .on { stroke: url(#wireOn); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .off { stroke: #3d5561; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="18" fill="url(#sky)"/>
  <rect width="1200" height="420" rx="18" fill="url(#grid)"/>

  <!-- wordmark -->
  <g class="t" transform="translate(72 132)">
    <text x="0" y="0" font-size="78" font-weight="700" fill="#e6f1f5" letter-spacing="-0.02em">logits</text>
    <rect x="238" y="-58" width="14" height="58" rx="3" fill="#2dd4bf"/>
    <text x="4" y="44" font-size="21" fill="#93b0bd">An interactive canvas for digital logic.</text>
    <text x="4" y="78" font-size="21" fill="#93b0bd">Place nodes, draw wires, watch the signal move.</text>
    <g transform="translate(4 116)">
      <rect x="0" y="-20" width="128" height="30" rx="15" fill="#12292c" stroke="#1f5f5a"/>
      <circle cx="18" cy="-5" r="5" fill="#2dd4bf"/>
      <text x="32" y="0" class="mono" font-size="13" fill="#6ee7d7">4-valued</text>
      <rect x="140" y="-20" width="150" height="30" rx="15" fill="#12292c" stroke="#1f5f5a"/>
      <circle cx="158" cy="-5" r="5" fill="#2dd4bf"/>
      <text x="172" y="0" class="mono" font-size="13" fill="#6ee7d7">event-driven</text>
      <rect x="302" y="-20" width="132" height="30" rx="15" fill="#12292c" stroke="#1f5f5a"/>
      <circle cx="320" cy="-5" r="5" fill="#2dd4bf"/>
      <text x="334" y="0" class="mono" font-size="13" fill="#6ee7d7">local-first</text>
    </g>
  </g>

  <!-- circuit: two switches -> AND / OR -> XOR -> LED (a half adder) -->
  <g transform="translate(640 70)">
    <!-- switches -->
    <g>
      <rect x="0" y="52" width="66" height="40" rx="8" class="body"/>
      <text x="33" y="77" text-anchor="middle" class="mono lbl" fill="#cfe6ee" font-size="14">A=1</text>
      <line x1="66" y1="72" x2="92" y2="72" class="pin"/>
      <rect x="0" y="182" width="66" height="40" rx="8" class="body"/>
      <text x="33" y="207" text-anchor="middle" class="mono lbl" fill="#cfe6ee" font-size="14">B=0</text>
      <line x1="66" y1="202" x2="92" y2="202" class="pin"/>
    </g>

    <!-- routed wires into the gates -->
    <path d="M92 72 H132 V112 H186" class="on"/>
    <path d="M92 72 H112 V232 H186" class="on"/>
    <path d="M92 202 H152 V152 H186" class="off"/>
    <path d="M92 202 H132 V272 H186" class="off"/>
    <circle cx="112" cy="72" r="4.5" fill="#5eead4"/>
    <circle cx="132" cy="202" r="4.5" fill="#3d5561"/>

    <!-- XOR gate (sum) -->
    <g transform="translate(186 92)">
      <path d="M2 0 Q28 40 2 80" fill="none" stroke="#2f4753" stroke-width="2"/>
      <path d="M14 0 Q40 40 14 80 L46 80 Q80 62 92 40 Q80 18 46 0 Z" fill="#16232b" stroke="#2f4753" stroke-width="2"/>
      <text x="46" y="46" text-anchor="middle" class="mono" font-size="13" fill="#8fa8b5">XOR</text>
      <line x1="92" y1="40" x2="120" y2="40" class="pin"/>
    </g>

    <!-- AND gate (carry) -->
    <g transform="translate(186 212)">
      <path d="M8 0 H50 Q90 0 90 40 Q90 80 50 80 H8 Z" fill="#16232b" stroke="#2f4753" stroke-width="2"/>
      <text x="46" y="46" text-anchor="middle" class="mono" font-size="13" fill="#8fa8b5">AND</text>
      <line x1="90" y1="40" x2="120" y2="40" class="pin"/>
    </g>

    <!-- outputs -->
    <path d="M306 132 H360" class="on"/>
    <path d="M306 252 H360" class="off"/>

    <!-- LEDs -->
    <g transform="translate(360 132)">
      <circle cx="34" cy="0" r="30" fill="url(#glow)"/>
      <circle cx="34" cy="0" r="17" fill="#2dd4bf" stroke="#5eead4" stroke-width="2"/>
      <text x="72" y="5" class="mono" font-size="14" fill="#cfe6ee">SUM</text>
    </g>
    <g transform="translate(360 252)">
      <circle cx="34" cy="0" r="17" fill="#1b2b33" stroke="#3d5561" stroke-width="2"/>
      <text x="72" y="5" class="mono" font-size="14" fill="#7f97a3">CARRY</text>
    </g>
  </g>
</svg>
